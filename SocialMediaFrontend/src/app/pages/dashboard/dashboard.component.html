<div class="min-h-screen bg-gradient-to-br from-purple-100 via-pink-50 to-purple-200 py-10">

  <div class="max-w-3xl mx-auto px-4">

    <div
      *ngFor="let post of posts"
      class="bg-white rounded-3xl shadow-lg overflow-hidden mb-8 hover:shadow-2xl transition-all duration-300">

      <!-- Image -->
      <div class="overflow-hidden">
        <img
          [src]="post.image"
          alt="Post Image"
          class="w-full h-[400px] object-cover hover:scale-105 transition duration-500">
      </div>

      <!-- Content -->
      <div class="p-6">

        <div *ngIf="editingId !== post.Id">

          <div class="flex justify-between items-start">
            <h2 class="text-3xl font-bold text-gray-800">
              {{ post.title }}
            </h2>
          </div>

          <p class="text-gray-600 mt-4 leading-relaxed text-lg">
            {{ post.description }}
          </p>

          <!-- Like + Comment Buttons -->
          <div class="flex gap-3 mt-6">

            <button
              (click)="likePost(post)"
              class="bg-pink-500 hover:bg-pink-600 text-white px-5 py-2 rounded-xl shadow-md transition">
              ❤️ {{ post.like || 0 }}
            </button>

            <button
              (click)="toggleComments(post)"
              class="bg-purple-500 hover:bg-purple-600 text-white px-5 py-2 rounded-xl shadow-md transition">
              💬 Comments
            </button>

          </div>

          <!-- Comments Section -->
          <div *ngIf="showComments[post.Id]" class="mt-6">

            <!-- Existing Comments -->
            <div
              *ngFor="let comment of comments[post.Id]"
              class="bg-gray-50 rounded-xl px-4 py-3 mb-3">

              <p class="text-sm font-bold text-purple-700">
                {{ comment.username }}
              </p>

              <p class="text-gray-700 text-sm mt-1">
                {{ comment.content }}
              </p>

            </div>

            <!-- No comments message -->
            <p
              *ngIf="comments[post.Id]?.length === 0"
              class="text-gray-400 text-sm mb-3">
              No comments yet. Be the first!
            </p>

            <!-- Add Comment Input -->
            <div class="flex gap-2 mt-3">

              <input
                [(ngModel)]="newComment[post.Id]"
                placeholder="Write a comment..."
                class="flex-1 border border-gray-300 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400">

              <button
                (click)="submitComment(post)"
                class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-xl text-sm transition">
                Post
              </button>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
